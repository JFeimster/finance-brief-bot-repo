    <h1>CSV Readiness Checklist</h1>
    <ul>
      <li>Does the file include dates?</li>
      <li>Does the file include amount, debit, or credit columns?</li>
      <li>Does the file include descriptions?</li>
      <li>Does the file include balances?</li>

    </ul>
